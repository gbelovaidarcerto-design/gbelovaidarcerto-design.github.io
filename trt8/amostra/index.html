<style>
:root{color-scheme:light;--azul:#2E6DA4;--azul-esc:#1A3A5C;--ambar:#F2B544;--papel:#EEF3F8;--sup:#fff;--tinta:#1E2A36;--suave:#5B6B7B;--linha:#D7E1EB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--papel:#0F1822;--sup:#16222F;--tinta:#E8EEF4;--suave:#A3B1BF;--linha:#263546}}
:root[data-theme="dark"]{color-scheme:dark;--papel:#0F1822;--sup:#16222F;--tinta:#E8EEF4;--suave:#A3B1BF;--linha:#263546}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Lato,system-ui,sans-serif;font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
.w{width:100%;max-width:900px;margin:0 auto;padding-inline:16px}
header{background:var(--azul);color:#fff;padding:max(20px,env(safe-area-inset-top)) 0 26px}
.k{font-weight:900;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ambar)}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(32px,8vw,48px);line-height:1.1;margin:10px 0 0}
header p{color:#E4EEF8;margin:12px 0 0;max-width:52ch}
.abas{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.abas button{font:inherit;font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:10px 18px;cursor:pointer}
.abas button[aria-selected="true"]{background:var(--ambar);border-color:var(--ambar);color:var(--azul-esc)}
.dica{font-size:14px;color:var(--suave);margin:18px 0 6px}
.pags{display:grid;gap:18px;padding-bottom:30px}
.pags img{width:100%;border-radius:6px;box-shadow:0 10px 26px rgba(26,58,92,.16);background:#fff}
.pag-n{font-size:13px;color:var(--suave);margin:0 0 6px}
.cta{position:sticky;bottom:0;background:var(--sup);border-top:1px solid var(--linha);padding:12px 0 max(12px,env(safe-area-inset-bottom))}
.cta .w{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta p{margin:0;font-size:14.5px;color:var(--suave)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;font-weight:900;text-decoration:none;background:var(--azul);color:#fff}
[hidden]{display:none!important}
</style>

<body>
<header>
  <div class="w">
    <p class="k">TRT 8 · Edital nº 01/2026 · FCC</p>
    <h1>Dia 1, inteiro e grátis</h1>
    <p>As sete páginas do primeiro dia, do jeito que estão no material. Escolha o seu cargo.</p>
    <div class="abas" role="tablist">
      <button role="tab" aria-selected="true" data-c="ao">Analista e Oficial</button>
      <button role="tab" aria-selected="false" data-c="tec">Técnico</button>
    </div>
  </div>
</header>
<main class="w">
  <p class="dica">No celular, use o zoom com dois dedos para ler cada página.</p>
  <div class="pags" id="ao"></div>
  <div class="pags" id="tec" hidden></div>
</main>
<div class="cta">
  <div class="w">
    <p>Material completo por cargo: <b>R$ 97</b> no lançamento.</p>
    <a class="btn" href="../#oferta">Ver os cargos</a>
  </div>
</div>
<script>
var nomes=['Roteiro do dia','Tema 1','Tema 2','Tema 3','Lei seca do dia','Jurisprudência, teses e treino','Discursiva'];
['ao','tec'].forEach(function(c){
  var box=document.getElementById(c),h='';
  for(var i=1;i<=7;i++){h+='<div><p class="pag-n">Página '+i+' · '+nomes[i-1]+'</p><img src="'+c+'/p'+i+'.webp" alt="Dia 1, página '+i+': '+nomes[i-1]+'" width="1100" height="1556" loading="'+(i<3?'eager':'lazy')+'"></div>';}
  box.innerHTML=h;
});
document.querySelectorAll('.abas button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.abas button').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});
    document.getElementById('ao').hidden=b.dataset.c!=='ao';document.getElementById('tec').hidden=b.dataset.c!=='tec';
    try{localStorage.setItem('trt8-cargo',b.dataset.c)}catch(e){}
  });
});
try{var s=localStorage.getItem('trt8-cargo')||(location.hash==='#tec'?'tec':null);if(s==='tec')document.querySelector('[data-c="tec"]').click();}catch(e){}
</script>
</body>
